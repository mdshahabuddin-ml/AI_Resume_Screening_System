services:

  # =========================
  # FASTAPI BACKEND
  # =========================
  - type: web
    name: ai-resume-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs

  # =========================
  # STREAMLIT FRONTEND
  # =========================
  - type: web
    name: ai-resume-frontend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run frontend/app.py --server.address=0.0.0.0 --server.port=$PORT --server.headless=true --browser.gatherUsageStats=false
    envVars:
      - key: API_URL
        value: https://ai-resume-backend.onrender.com
